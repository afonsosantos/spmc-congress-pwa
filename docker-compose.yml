services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spmc_congresso}
      POSTGRES_USER: ${POSTGRES_USER:-spmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      # Exposed to the host so `bun run dev` (running outside Docker) can
      # reach it too — only the app service needs the internal `postgres`
      # hostname.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-spmc} -d ${POSTGRES_DB:-spmc_congresso}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
